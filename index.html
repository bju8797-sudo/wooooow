<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>모아봐요 A+의 숲 — 통합 빌드 (장면 1~17)</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#9bd;--u:.35px;width:360px;height:640px}
canvas#gl,canvas#snap{position:absolute;left:0;top:0;width:100%;height:100%}
.ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#fade{background:#000;opacity:1;z-index:30}
#iris{display:none;z-index:31}
#cap{z-index:12;display:flex;flex-direction:column;align-items:center;padding-top:calc(480*var(--u));box-sizing:border-box;text-align:center;color:#fff;font-weight:800;font-size:calc(96*var(--u));text-shadow:0 calc(4*var(--u)) calc(14*var(--u)) rgba(0,0,0,.55);opacity:0;transition:opacity .6s}
#cap small{display:block;font-size:.5em;margin-top:.3em;font-weight:700}
#dlg{position:absolute;left:4%;top:76%;width:92%;height:21%;box-sizing:border-box;background:rgba(255,255,255,.92);border-radius:calc(40*var(--u));padding:calc(62*var(--u)) calc(50*var(--u)) calc(24*var(--u));display:none;z-index:10;box-shadow:0 calc(6*var(--u)) calc(24*var(--u)) rgba(0,0,0,.28)}
#nm{position:absolute;left:calc(40*var(--u));top:calc(-32*var(--u));background:#8c9bb0;color:#fff;font-weight:700;font-size:calc(40*var(--u));padding:calc(8*var(--u)) calc(34*var(--u));border-radius:calc(30*var(--u))}
#tx{font-size:calc(44*var(--u));line-height:1.38;color:#333;word-break:keep-all}
#nx{position:absolute;right:calc(40*var(--u));bottom:calc(18*var(--u));font-size:calc(40*var(--u));color:#e8913a;animation:bl 1s infinite;visibility:hidden}
#nx.big{font-size:calc(64*var(--u));animation-duration:.6s}
@keyframes bl{50%{opacity:.2}}
#joyO,#joyI{display:none!important}   /* 가상 조이스틱 UI 제거: 내부 코드 호환용 빈 요소만 남기고 절대 표시하지 않음 */
#hint{position:absolute;left:0;width:100%;top:60%;display:none;z-index:14;color:#fff;font-size:calc(44*var(--u));font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.6);text-align:center;pointer-events:none}
#hint b{display:inline-block;font-size:calc(90*var(--u))}
#toast{position:absolute;left:8%;width:84%;top:9%;z-index:14;background:rgba(0,0,0,.55);color:#fff;border-radius:calc(30*var(--u));padding:calc(18*var(--u)) calc(24*var(--u));text-align:center;font-size:calc(38*var(--u));opacity:0;transition:opacity .4s;pointer-events:none}
#gear{position:absolute;right:3%;top:2%;width:calc(110*var(--u));height:calc(110*var(--u));border-radius:50%;background:rgba(255,255,255,.75);font-size:calc(62*var(--u));line-height:calc(110*var(--u));text-align:center;cursor:pointer;z-index:20;display:none}
#menu,#end,#start{position:absolute;left:0;top:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#menu{background:rgba(0,0,0,.6);z-index:40;gap:calc(34*var(--u))}
#end{background:rgba(20,22,50,.92);z-index:45;color:#fff;font-size:calc(46*var(--u));line-height:1.5;gap:calc(40*var(--u));padding:0 calc(60*var(--u));box-sizing:border-box}
#start{display:flex;z-index:50;background:linear-gradient(#bfe6ff,#ffe9f0);color:#5a4a6a;cursor:pointer}
#menu button,#end button{font-size:calc(52*var(--u));padding:calc(26*var(--u)) calc(90*var(--u));border:0;border-radius:calc(60*var(--u));background:#fff;color:#444;font-family:inherit;cursor:pointer}
#rot{position:fixed;left:0;top:0;width:100%;height:100%;background:#000;color:#fff;z-index:100;display:none;align-items:center;justify-content:center;font-size:22px}
#ldbar{width:50%;height:calc(14*var(--u));background:rgba(255,255,255,.7);border-radius:20px;margin-top:calc(40*var(--u));overflow:hidden}
#ldin{height:100%;width:0;background:#f4a261;transition:width .5s}
#dlg.narr{top:38%;height:auto;min-height:20%;background:rgba(20,22,45,.62);padding:calc(44*var(--u)) calc(50*var(--u))}
#dlg.narr #tx{color:#fff;text-align:center;font-size:calc(52*var(--u));line-height:1.5}
#dlg.narr.fr{left:12%;width:76%;top:auto;bottom:30.5%;min-height:0;z-index:14;padding:calc(20*var(--u)) calc(30*var(--u)) calc(36*var(--u));border-radius:calc(26*var(--u));background:rgba(20,22,45,.55)}   /* 장면 17: 문구 상자를 액자 안쪽 맨 아래에 붙임 (사진을 가리는 면적 최소화) */
#dlg.narr.fr #tx{font-size:calc(38*var(--u));line-height:1.4}
</style>
</head>
<body>
<div id="stage">
 <canvas id="gl"></canvas>
 <canvas id="snap" style="display:none;opacity:0;pointer-events:none"></canvas>
 <div id="cap" class="ov"></div>
 <div id="dlg"><div id="nm"></div><div id="tx"></div><div id="nx">▼</div></div>
 <div id="joyO"></div><div id="joyI"></div>
 <div id="hint"><b id="arr">➤</b><br>반짝이는 곳으로 걸어가 보세요</div>
 <div id="toast"></div>
 <div id="gear">⚙</div>
 <div id="iris" class="ov"></div>
 <div id="fade" class="ov"></div>
 <div id="menu">
  <button id="bMute">소리 끄기</button>
  <button id="bRestart">처음부터</button>
   <button id="bPhoto">사진 불러오기</button><input id="fPhoto" type="file" accept="image/*" multiple style="display:none">
  <button id="bClose">닫기</button>
 </div>
 <div id="end">
    <div style="font-size:calc(100*var(--u));font-weight:800;letter-spacing:.08em">THE END</div><div style="font-size:calc(40*var(--u))">모아봐요 A+의 숲 · 한영대학교</div>
  <button id="bAgain">처음부터</button>
 </div>
 <div id="start">
  <div style="font-size:calc(92*var(--u));font-weight:800">모아봐요 A+의 숲</div>
    <div style="font-size:calc(40*var(--u));margin-top:calc(16*var(--u))">한영대학교 · 통합 빌드 (장면 1~17)</div>
  <div id="ldbar"><div id="ldin"></div></div>
  <div id="ldtx" style="font-size:calc(44*var(--u));margin-top:calc(60*var(--u));padding:0 calc(60*var(--u))">불러오는 중…</div>
 </div>
</div>
<div id="rot">세로로 돌려 주세요</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
// 인터넷 연결이 필요합니다 (three.js를 CDN에서 불러옴, 오프라인 실행 불가)
const URLS=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'];
function loadThree(ok){let i=0;(function t(){
  if(window.THREE) return ok();
  if(i>=URLS.length){$('ldtx').textContent='3D 라이브러리를 불러오지 못했어요. 이 게임은 인터넷 연결이 필요합니다. 연결을 확인하고 새로고침해 주세요.';return;}
  const s=document.createElement('script');s.src=URLS[i++];s.onload=()=>window.THREE?ok():t();s.onerror=t;document.head.appendChild(s);
})();}
loadThree(function(){try{main();}catch(e){$('ldtx').textContent='화면을 불러오지 못했어요. 새로고침해 주세요. ('+e.message+')';console.error(e);}});

function main(){
const T=THREE;
const stage=$('stage'),cv=$('gl'),snap=$('snap');
const R=new T.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const camera=new T.PerspectiveCamera(50,9/16,.1,200);
let S=new T.Scene(),sun=null,ringG=null,envKey='',envUpd=[],WALLS=[],orb=null,WS=null,M=null;
let U=.35,SW=360,SH=640,started=false,ready=false,paused=false,low=false,frozen=false,showNums=true,clock=0;
const rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const startScene=clamp(parseInt(qs.get('scene'))||1,1,17);   // 테스트용: ?scene=번호 (1~17)

/* ---------- 화면 크기 (9:16 고정, PC에서는 가운데 + 검은 여백) ---------- */
function resize(){
  const iw=innerWidth,ih=innerHeight;
  SW=Math.floor(Math.min(iw,ih*9/16));SH=Math.floor(SW*16/9);U=SW/1080;
  stage.style.width=SW+'px';stage.style.height=SH+'px';stage.style.setProperty('--u',U+'px');
  R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setSize(SW,SH,false);
  camera.aspect=SW/SH;camera.setViewOffset(SW,SH,0,SH*0.12,SW,SH);camera.updateProjectionMatrix(); // 인물 중심선을 위로 12%
  const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  $('rot').style.display=(touch&&iw>ih*1.1)?'flex':'none';
}
addEventListener('resize',resize);addEventListener('orientationchange',resize);

/* ---------- 소리 (코드로 합성한 기본 소리, 나중에 외부 음원으로 교체 가능) ---------- */
const A={c:null,mute:false,bg:null};
function ainit(){if(A.c)return;try{
  A.c=new (window.AudioContext||window.webkitAudioContext)();
  A.out=A.c.createGain();A.out.connect(A.c.destination);
  A.sfx=A.c.createGain();A.sfx.gain.value=.7;A.sfx.connect(A.out);
  A.bus=A.c.createGain();A.bus.gain.value=.5;A.bus.connect(A.out);
}catch(e){A.c=null;}}
function tone(f,d,type,v,delay,f2){
  if(!A.c||A.mute)return;const t=A.c.currentTime+(delay||0);
  const o=A.c.createOscillator(),g=A.c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(A.sfx);o.start(t);o.stop(t+d+.05);
}
function sfx(n){switch(n){
  case 'bell':tone(880,.9,'sine',.25);tone(1320,.9,'sine',.1);tone(880,.9,'sine',.25,.45);break;
  case 'rise':tone(300,.8,'triangle',.22,0,1200);break;
  case 'ting':tone(1200,.3,'sine',.15);break;
}}
const TR={
  T1:{bpm:116,w:'triangle',root:261.6,sc:[0,2,4,7,9],pat:[0,2,4,2,3,2,1,2],bass:[0,0,3,2],v:.5},
  T2:{bpm:84,w:'square',root:130.8,sc:[0,3,5,6,7],pat:[0,1,0,2,0,3,2,1],bass:[0,0,2,1],v:.28},
  T3:{bpm:128,w:'sine',root:293.7,sc:[0,2,4,5,7,9],pat:[0,2,4,2,5,4,2,3],bass:[0,3,4,3],v:.5}
};
function note(dest,f,t,d,w,v){const o=A.c.createOscillator(),e=A.c.createGain();o.type=w;o.frequency.value=f;
  e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(v*.25,t+.02);e.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(e);e.connect(dest);o.start(t);o.stop(t+d+.05);}
function bgm(id){ // 1초 크로스페이드
  if(!A.c)return;const old=A.bg;
  if(old){const ct=A.c.currentTime;old.g.gain.cancelScheduledValues(ct);old.g.gain.setValueAtTime(old.g.gain.value,ct);old.g.gain.linearRampToValueAtTime(0,ct+1);
    setTimeout(()=>{clearInterval(old.iv);try{old.g.disconnect();}catch(e){}},1100);A.bg=null;}
  const tr=TR[id];if(!tr)return;
  const g=A.c.createGain();g.gain.setValueAtTime(0,A.c.currentTime);g.gain.linearRampToValueAtTime(tr.v,A.c.currentTime+1);g.connect(A.bus);
  let step=0,next=A.c.currentTime+.1;const spb=60/tr.bpm/2;
  const iv=setInterval(()=>{while(next<A.c.currentTime+.3){
    const deg=tr.sc[tr.pat[step%8]%tr.sc.length];note(g,tr.root*Math.pow(2,deg/12),next,spb*.9,tr.w,.5);
    if(step%4===0){const bd=tr.sc[tr.bass[Math.floor(step/4)%4]%tr.sc.length];note(g,tr.root/2*Math.pow(2,bd/12),next,spb*3.5,'sine',.8);}
    next+=spb;step++;}},100);
  A.bg={g,iv};
}
function duck(on){if(A.c)A.bus.gain.linearRampToValueAtTime(on?.4:.5,A.c.currentTime+.2);}  // 대사 중 BGM 약 20% 감소
let birdIv=null;function birds(on){clearInterval(birdIv);if(on)birdIv=setInterval(()=>{tone(2200+rnd()*1200,.08,'sine',.04,0,3400);},1700);}
function toggleMute(){A.mute=!A.mute;if(A.c)A.out.gain.value=A.mute?0:1;$('bMute').textContent=A.mute?'소리 켜기':'소리 끄기';} // 화면 연출은 그대로 유지
document.addEventListener('visibilitychange',()=>{if(!A.c)return;document.hidden?A.c.suspend():A.c.resume();});

/* ---------- 도형 도우미 ---------- */
const mats={};const mt=c=>mats[c]||(mats[c]=new T.MeshLambertMaterial({color:c}));
function addM(geo,c,x,y,z){const m=new T.Mesh(geo,mt(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;S.add(m);return m;}
const bx=(w,h,d,c,x,y,z)=>addM(new T.BoxGeometry(w,h,d),c,x,y,z);
const cy=(rt,rb,h,c,x,y,z,s)=>addM(new T.CylinderGeometry(rt,rb,h,s||12),c,x,y,z);
const sp=(r,c,x,y,z)=>addM(new T.SphereGeometry(r,12,8),c,x,y,z);
function mkTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return new T.CanvasTexture(c);}
function plane(w,h,tex,x,y,z,ry){const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex,transparent:true}));m.position.set(x,y,z);m.rotation.y=ry||0;S.add(m);return m;}
const FONT='"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
function txtTex(t,w,h,fs,fg,bg){return mkTex(w,h,(x,W,H)=>{if(bg){x.fillStyle=bg;x.fillRect(0,0,W,H);}x.font='bold '+fs+'px '+FONT;x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.fillText(t,W/2,H/2);});}
const tcache={};
function iconTex(e){if(tcache[e])return tcache[e];const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
  x.font='64px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,48,52);return tcache[e]=new T.CanvasTexture(c);}
function spr(e,s){const m=new T.Sprite(new T.SpriteMaterial({map:iconTex(e),transparent:true,depthTest:false}));m.scale.set(s,s,1);m.renderOrder=10;return m;}
function numSpr(n){const t=mkTex(64,64,(x)=>{x.fillStyle='#fff';x.beginPath();x.arc(32,32,28,0,7);x.fill();x.fillStyle='#555';x.font='bold 40px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText(n,32,34);});
  const m=new T.Sprite(new T.SpriteMaterial({map:t,transparent:true,depthTest:false}));m.scale.set(.34,.34,1);m.renderOrder=10;return m;}

/* ---------- 임시 마네킹 (회색, 번호만 표시 / 얼굴 없음 / 삼각형 약 2,000 이하) ---------- */
// 이것은 임시 구현입니다. 같은 이름의 GLB가 준비되면 교체할 수 있도록 뼈대 이름(J)과 동작 이름(ACT)을 분리해 두었습니다.
const NAMES={jinwool:'배진울',geunsik:'박근식',gangbin:'박강빈',youngwoo:'김영우',chanyoung:'김찬영'};
const NUM={jinwool:1,geunsik:2,gangbin:3,youngwoo:4,chanyoung:5};
const BLIP={chanyoung:[520,'triangle'],jinwool:[400,'triangle'],gangbin:[320,'triangle'],geunsik:[300,'square'],youngwoo:[240,'sine']};
// 표정 16종 (마네킹은 얼굴이 없어 머리 기울기 + 머리 위 아이콘으로 표시. 아이콘은 임시)
const EX={'기본':['',0],'미소':['🙂',0],'활짝웃음':['😄',0],'쑥스러움':['😊',.1],'당황':['💦',0],'갸웃':['❓',.25],'지침':['💨',0],'졸림':['💤',0],
  '놀람':['❗',0],'긴장':['💧',0],'결의':['✨',0],'시무룩':['☁️',0],'감동':['💗',0],'눈물웃음':['😂',0],'장난':['😜',.12],'집중':['🔎',0]};
const D={lax:0,laz:.1,lex:-.15,rax:0,raz:.1,rex:-.15,hx:0,hz:0,hy:0,sx:0,sz:0,by:0,ll:0,lr:0,kl:0,kr:0};
function makeChar(id){
  const g=new T.Group(),mat=mt(0xb7bcc6);
  const G=(x,y,p)=>{const o=new T.Group();o.position.set(x,y,0);p.add(o);return o;};
  const M_=(geo,y,p)=>{const o=new T.Mesh(geo,mat);o.castShadow=true;o.position.y=y;p.add(o);return o;};
  const hips=G(0,.62,g),spine=G(0,0,hips);M_(new T.CylinderGeometry(.2,.17,.44,10),.22,spine);
  const neck=G(0,.5,spine);M_(new T.SphereGeometry(.26,14,10),.26,neck);
  const arm=s=>{const sh=G(s*.26,.4,spine);M_(new T.CylinderGeometry(.055,.05,.28,8),-.14,sh);const el=G(0,-.28,sh);M_(new T.CylinderGeometry(.05,.045,.26,8),-.13,el);M_(new T.SphereGeometry(.06,8,6),-.27,el);return{sh,el};};
  const leg=s=>{const hp=G(s*.1,0,hips);M_(new T.CylinderGeometry(.07,.06,.3,8),-.15,hp);const kn=G(0,-.3,hp);M_(new T.CylinderGeometry(.06,.05,.3,8),-.15,kn);const f=M_(new T.BoxGeometry(.11,.06,.2),-.32,kn);f.position.z=.04;return{hp,kn};};
  const ch={id,g,J:{hips,spine,neck,AL:arm(1),AR:arm(-1),LL:leg(1),LR:leg(-1)},a:Object.assign({},D),act:'idle',t:0,ex:'기본',sit:false,sitAmt:0,ry:0,wk:null};
  ch.num=numSpr(NUM[id]);ch.num.position.set(0,1.95,0);g.add(ch.num);
  ch.exS=spr('❓',.42);ch.exS.position.set(.4,1.75,0);ch.exS.visible=false;g.add(ch.exS);
  return ch;
}
const C={};for(const k in NAMES)C[k]=makeChar(k);
const base=c=>c.sit?'sit_idle':'idle';
function setAct(c,n){if(c.act!==n){c.act=n;c.t=0;}}
function setExpr(c,n){c.ex=n;const e=EX[n]||EX['기본'];if(e[0]){c.exS.material.map=iconTex(e[0]);c.exS.material.needsUpdate=true;c.exS.visible=true;}else c.exS.visible=false;}
// 동작 (절차 애니메이션). 관절 목표값을 돌려줌
function ACT(n,t){const s=Math.sin,p={};switch(n){
  case 'walk':{const w=s(t*7);p.ll=w*.6;p.lr=-w*.6;p.kl=Math.max(0,-w)*.8;p.kr=Math.max(0,w)*.8;p.lax=-w*.5;p.rax=w*.5;p.by=Math.abs(w)*.04;break;}
  case 'idle':case 'sit_idle':p.by=s(t*2)*.005;p.sx=s(t*2)*.01;break;
  case 'talk':p.lax=-.3+s(t*5)*.25;p.rax=-.3+s(t*5+1.5)*.25;p.lex=-.6;p.rex=-.6;p.hx=s(t*6)*.05;break;
  case 'nod':p.hx=.15+s(t*6)*.2;break;
  case 'laugh':p.sx=-.08+s(t*14)*.04;p.by=Math.abs(s(t*9))*.03;p.hx=-.15;p.lax=-.3;p.rax=-.3;break;

  else{joy.x=0;joy.y=0;}
  updMove1(dt);};
const toast0=toast;toast=function(m,sec){if(typeof m==='string'&&/조이스틱|반짝이는 곳까지/.test(m))return;return toast0(m,sec);};   // 옛 조이스틱 안내·중복 이동 안내 토스트는 상단 고정 문구로 대체
const SC={1:s1,2:s2,3:s3,4:s4,5:s5};
SCENES52.forEach((f,i)=>{SC[6+i]=f;});   // 5-2: 장면 6~11
SCENES53.forEach((f,i)=>{SC[12+i]=f;});   // 5-3: 장면 12~17 등록 (장면 11 다음에 이어서 실행됨)
async function play(){
  try{for(let n=startScene;SC[n];n++)await SC[n]();}catch(e){console.error(e);toast('오류: '+e.message,6);return;}
  $('end').style.display='flex';
}

/* ---------- 메인 루프 ---------- */
let last=performance.now(),fa=0,fn=0,vOff=0,vbn=null,callT=0,capSeen=false;const _zv=new T.Vector3(),_zl=new T.Vector3(),_pc=new T.Vector3(1e9,0,0);
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000;last=now;let dt=Math.min(raw,.05);if(paused||!started)dt=0;clock+=dt;
  // 장면 9(영상통화): 자막 카드가 끝난 뒤 통화 구간(약 13초)을 약 5초로 압축. 처음 1.5초(칸이 차례로 뜨는 구간)는 그대로, 이후는 3.3배속. 타이머·환경 갱신에만 적용(캐릭터 동작 속도는 그대로).
  let dtT=dt;if(envKey==='call'){if($('cap').style.opacity==='1')capSeen=true;else if(capSeen){callT+=dt;dtT=dt*(callT<1.5?1:3.3);}}else{callT=0;capSeen=false;}
  for(let i=timers.length-1;i>=0;i--){timers[i].t-=dtT;if(timers[i].t<=0){const r=timers[i].r;timers.splice(i,1);r();}}
  if(DL.on&&DL.typing){const prev=Math.floor(DL.acc);DL.acc+=dt*30;const n=Math.min(DL.full.length,Math.floor(DL.acc));   // 초당 약 30자
    if(n!==prev){$('tx').textContent=DL.full.slice(0,n);const ch=DL.full[n-1];if(ch&&ch!==' '&&n%2===0){const b=BLIP[DL.spk];if(b)tone(b[0]*(1+rnd()*.08),.045,b[1],.05);}}   // 화자 '모두'(spk='')는 소리 없음
    if(n>=DL.full.length)finishType();}
  if(DL.on&&!DL.typing&&performance.now()-DL.done>6000)$('nx').className='big';   // 6초 동안 탭이 없으면 ▼가 더 크게 깜빡임
  if(!frozen)for(const k in C){const c=C[k];if(c.g.parent)updChar(c,dt);}
  for(const k in C){const ch=C[k].g.children;for(let i=0;i<ch.length;i++){const o=ch[i];if(o.isSprite&&o.renderOrder>=11)o.visible=false;}}   // 말풍선(렌더 순서 11) 숨김: 캐릭터 동작·표정·정식 대사 UI는 그대로
  if(M)updMove(dt);moveUI();
  envUpd.forEach(f=>f(dtT,clock));
  if(orb){orb.a+=orb.w*dt;cam0.p.set(orb.c.x+Math.sin(orb.a)*orb.r,orb.h,orb.c.z+Math.cos(orb.a)*orb.r);cam0.l.set(orb.c.x,orb.ly,orb.c.z);cam0.f=orb.f;cam0.k=10;}
  const f=1-Math.exp(-cam0.k*dt);
  // 장면 6 미션(안내 배너가 보일 동안): 화면 투영만 16% 아래로 내려 테이블·친구가 상단 안내 자막과 겹치지 않게 함 (카메라 각도·거리는 그대로)
  const want=(envKey==='cafe6'&&(vbn||(vbn=stage.querySelector('.m52')))&&vbn.style.display==='block')?-.16:0;
  vOff+=(want-vOff)*(1-Math.exp(-3*dt));if(camera.view)camera.view.offsetY=SH*(.12+vOff);
  let cp=cam0.p,lt=cam0.l,fv=cam0.f,snapCut=false;
  if(envKey==='exam'){const dd=cam0.p.distanceTo(cam0.l);   // 장면 10(중간고사)
    if(dd<2.6){   // 얼굴·손 근접 컷: 비스듬히 위에서 넓게 — 상체·팔·책상·시험지가 함께 보이도록 거리 약 3.4m, 시선은 앉은 몸통 높이, 화각 40°
      const hx=cam0.p.x-cam0.l.x,hz=cam0.p.z-cam0.l.z,hl=Math.hypot(hx,hz)||1;
      lt=_zl.set(cam0.l.x,.95,.05);cp=_zv.set(clamp(lt.x+hx/hl*2.9,-4,4),lt.y+1.7,Math.max(lt.z+hz/hl*2.9,-2.8));fv=40;
      snapCut=cam0.p.distanceToSquared(_pc)>1e-6;_pc.copy(cam0.p);}   // 컷이 바뀐 프레임은 보간 없이 바로 이동(몽타주 하드 컷 유지)
    else if(dd<9)cp=_zv.copy(cam0.p).sub(cam0.l).multiplyScalar(1.3).add(cam0.l);}   // 먼 컷은 기존 30% 줌 아웃 그대로
  if(snapCut){camera.position.copy(cp);look.copy(lt);camera.fov=fv;}
  camera.position.lerp(cp,f);look.lerp(lt,f);camera.fov+=(fv-camera.fov)*f;camera.updateProjectionMatrix();camera.lookAt(look);
  if(started&&!paused){fa+=raw;fn++;if(fa>3){if(fn/fa<24&&!low){low=true;if(sun)sun.castShadow=false;}fa=0;fn=0;}}   // 24fps 미만이면 저사양 모드
  R.render(S,camera);
}

/* ---------- 시작 ---------- */
function begin(){if(started||!ready)return;ainit();if(A.c&&A.c.state==='suspended')A.c.resume();started=true;$('start').style.display='none';$('gear').style.display='block';play();}
$('start').addEventListener('pointerup',e=>{e.stopPropagation();begin();});
resize();requestAnimationFrame(frame);
$('ldin').style.width='100%';
setTimeout(()=>{ready=true;$('ldtx').textContent='화면을 터치하면 시작합니다';},500);
}
})();
</script>
